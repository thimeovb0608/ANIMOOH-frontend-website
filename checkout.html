<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Afrekenen — ANIMOOH!</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .checkout-wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: calc(var(--header-h) + 56px) 24px 80px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 48px;
      align-items: start;
    }
    .order-summary {
      background: linear-gradient(135deg, #fff8c5, #ffe0d6);
      border-radius: 24px;
      padding: 28px;
      position: sticky;
      top: calc(var(--header-h) + 32px);
    }
    .order-summary > h2 {
      font-family: 'BrauerNeue', sans-serif;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .summary-line {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .summary-line img { width: 52px; height: 52px; object-fit: contain; }
    .summary-line h3 {
      font-family: 'BrauerNeue', sans-serif;
      font-weight: 700;
      font-size: 13px;
      line-height: 1.35;
      margin-bottom: 4px;
    }
    .summary-line .qty { font-size: 12px; color: #7a6a5f; }
    .summary-line .amount {
      font-family: 'BrauerNeue', sans-serif;
      font-weight: 900;
      font-size: 14px;
      white-space: nowrap;
    }
    .summary-ship {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 14px;
      color: #7a6a5f;
    }
    .summary-ship .is-free { color: #2e7d32; font-weight: 700; }
    .summary-nudge {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.65);
      color: #7a5c00;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
    .summary-total {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid rgba(0,0,0,0.1);
      font-family: 'BrauerNeue', sans-serif;
      font-weight: 900;
    }
    .summary-total span { font-size: 15px; }
    .summary-total strong { font-size: 28px; color: var(--orange); }
    .summary-edit {
      display: inline-block;
      margin-top: 14px;
      font-size: 13px;
      color: var(--orange);
      font-weight: 700;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
      font-family: inherit;
    }
    .checkout-form h1 {
      font-family: 'BrauerNeue', sans-serif;
      font-weight: 900;
      font-size: 32px;
      margin-bottom: 24px;
    }
    .checkout-form label {
      display: block;
      font-family: 'BrauerNeue', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      margin: 16px 0 6px;
    }
    .checkout-form input, .checkout-form select {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #e5e5e5;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .checkout-form input:focus, .checkout-form select:focus {
      outline: none;
      border-color: var(--orange);
    }
    .form-row { display: grid; grid-template-columns: 1fr 2fr; gap: 14px; }
    .pay-btn {
      width: 100%;
      margin-top: 28px;
      background: var(--orange);
      color: white;
      border: none;
      font-family: 'BrauerNeue', sans-serif;
      font-weight: 900;
      font-size: 17px;
      padding: 17px;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(231,64,16,0.3);
    }
    .pay-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(231,64,16,0.4); }
    .pay-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; transform: none; }
    .checkout-error {
      display: none;
      margin-top: 16px;
      background: #fdecea;
      color: #b3261e;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
    }
    .secure-note {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: #777;
    }
    @media (max-width: 820px) {
      .checkout-wrap { grid-template-columns: 1fr; padding-top: calc(var(--header-h) + 32px); }
      .order-summary { position: static; }
    }
  </style>
</head>
<body>

  <!-- PROMO BAR -->
  <div class="promo-bar">🚚 Gratis verzending vanaf € 50</div>

  <!-- NAV -->
  <nav class="nav-brand">
    <a href="index.html" class="nav-brand-logo">
      <img src="Assets/Logo/Animooh Logo transparant.png" alt="ANIMOOH!" />
    </a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul>
      <li><a href="products.html">Producten</a></li>
      <li><a href="no-pee-here.html">No Pee Here</a></li>
      <li><a href="good-smell.html">Good Smell</a></li>
      <li><a href="blog">Blog</a></li>
      <li><a href="about.html">Over ons</a></li>
    </ul>
  </nav>

  <div class="checkout-wrap">
    <div class="order-summary">
      <h2>Jouw bestelling</h2>
      <div id="summary-lines"></div>
      <p class="summary-nudge" id="summary-nudge" hidden></p>
      <div class="summary-ship" id="summary-ship-row">
        <span>Verzending</span><span id="summary-shipping"></span>
      </div>
      <div class="summary-total"><span>Totaal</span><strong id="summary-total">…</strong></div>
      <button type="button" class="summary-edit" id="summary-edit">Winkelmandje aanpassen</button>
    </div>

    <form class="checkout-form" id="form">
      <h1>Afrekenen</h1>

      <label for="name">Naam</label>
      <input id="name" name="name" required autocomplete="name" />

      <label for="email">E-mailadres</label>
      <input id="email" name="email" type="email" required autocomplete="email" />

      <label for="street">Straat + huisnummer</label>
      <input id="street" name="street" required autocomplete="street-address" />

      <div class="form-row">
        <div>
          <label for="zip">Postcode</label>
          <input id="zip" name="zip" required autocomplete="postal-code" />
        </div>
        <div>
          <label for="city">Gemeente</label>
          <input id="city" name="city" required autocomplete="address-level2" />
        </div>
      </div>

      <label for="country">Land</label>
      <select id="country" name="country">
        <option value="BE" selected>België</option>
        <option value="NL">Nederland</option>
      </select>

      <button class="pay-btn" type="submit" id="pay">Betalen</button>
      <div class="checkout-error" id="error"></div>
      <p class="secure-note">🔒 Veilig betalen via Mollie — Bancontact, iDEAL, kaart en meer.</p>
    </form>
  </div>

  <!-- cart.js must load first — the script below reads window.ANIMOOH_CART. -->
  <script src="nav.js"></script>
  <script src="cart.js"></script>

  <script>
    // The basket itself lives in cart.js; this page only renders it and hands
    // it to /api/checkout. Prices shown here come from cart.js's shared maths,
    // which mirrors what the server actually charges.
    const cart = window.ANIMOOH_CART;

    function renderSummary() {
      const lines = cart.lines();
      const box = document.getElementById("summary-lines");
      const payBtn = document.getElementById("pay");

      if (lines.length === 0) {
        box.innerHTML = '<p style="padding:20px 0;color:#7a6a5f;">Je winkelmandje is leeg.<br />' +
          '<a href="products.html" style="color:var(--orange);font-weight:700;">Bekijk onze producten →</a></p>';
        document.getElementById("summary-total").textContent = cart.fmt(0);
        document.getElementById("summary-ship-row").hidden = true;
        document.getElementById("summary-nudge").hidden = true;
        payBtn.disabled = true;
        return;
      }

      box.innerHTML = lines.map(l =>
        '<div class="summary-line">' +
        '<img src="' + l.image + '" alt="" />' +
        '<div><h3>' + l.name + '</h3><div class="qty">Aantal: ' + l.quantity + '</div></div>' +
        '<div class="amount">' + cart.fmt(l.total) + '</div>' +
        '</div>'
      ).join("");

      const t = cart.totals();
      const shipBox = document.getElementById("summary-shipping");
      const nudge = document.getElementById("summary-nudge");

      document.getElementById("summary-ship-row").hidden = false;
      shipBox.textContent = t.shipping > 0 ? cart.fmt(t.shipping) : "Gratis";
      shipBox.classList.toggle("is-free", t.shipping === 0);

      if (t.amountToFreeShipping > 0) {
        nudge.textContent =
          "Nog " + cart.fmt(t.amountToFreeShipping) + " en je verzending is gratis!";
        nudge.hidden = false;
      } else {
        nudge.hidden = true;
      }

      document.getElementById("summary-total").textContent = cart.fmt(t.grandTotalInclVat);
      payBtn.disabled = false;
    }

    cart.ready(renderSummary);
    document.addEventListener("animooh-cart-changed", renderSummary);
    document.getElementById("summary-edit").addEventListener("click", cart.open);

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("pay");
      const errBox = document.getElementById("error");
      const basket = cart.read();

      if (Object.keys(basket).length === 0) {
        errBox.textContent = "Je winkelmandje is leeg.";
        errBox.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Even geduld…";
      errBox.style.display = "none";
      try {
        const resp = await fetch("/api/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            items: Object.keys(basket).map(id => ({ productId: id, quantity: basket[id] })),
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            street: document.getElementById("street").value,
            zip: document.getElementById("zip").value,
            city: document.getElementById("city").value,
            country: document.getElementById("country").value
          })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || "Er ging iets mis.");
        location.href = data.checkoutUrl;
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Betalen";
      }
    });
  </script>
</body>
</html>
